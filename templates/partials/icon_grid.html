<div class="icon-grid">
  {% for icon in icons %}
  <a
    href="/1x1/{{ icon.author }}/{{ icon.icon_id }}.html"
    id="icon--{{ icon.author }}--{{ icon.icon_id }}"
  >
    <figure class="icon-cell">
      <img
        src="/assets/icons/{{ icon.author }}/{{ icon.icon_id }}.svg"
        loading="lazy"
      />
      <figcaption>{{ icon.title | default(value=icon.icon_id) }}</figcaption>
    </figure>
  </a>
  {% endfor %}
</div>
