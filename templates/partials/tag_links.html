{% set tag_info = load_data(path="data/generated/tag_info.json") %}
<div class="tags center">
  {%- for tag_id in tags -%}
    {%- if not tag_info[tag_id].parent -%}
      <strong> {% include "partials/tag_link.html" %} </strong>
    {%- else -%}
      {% include "partials/tag_link.html" %}
    {%- endif -%}
  {%- endfor -%}
</div>
