{% set tag_info = load_data(path="data/generated/tag_info.json") %}
<div class="tags center">
  {%- for tag in tags -%}
    {%- set t = tag_info[tag] -%}
    {%- if not t.parent -%}
      <strong><a class="tag" href="/tags/{{ tag }}.html">{{ t.name | default(value=tag) }}</a></strong>
    {%- else -%}
      <a class="tag" href="/tags/{{ tag }}.html">{{ t.name | default(value=tag) }}</a>
    {%- endif -%}
  {%- endfor -%}
</div>
