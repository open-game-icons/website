<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Render-blocking: content is not painted until the stylesheet is ready. -->
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    {% block body %}{% endblock %}

    {% set build_time = now(utc=true) %}
    <footer>
      <p>
        © <a href="https://frie.dev">Aaron Friesen</a> and <a href="https://github.com/open-game-icons/website/graphs/contributors">Open Game Icons contributors</a>
      </p>
      <p>
        This website is <a href="https://github.com/open-game-icons/website">open source</a> under the <a href="/LICENSE.txt">GNU AGPLv3</a>.
      </p>
      <p>
        Last built:
        <time id="build-time"
              datetime="{{ build_time | date(format='%Y-%m-%dT%H:%M:%SZ') }}">
          {{ build_time | date(format="%Y-%m-%d %H:%M UTC") }}
        </time>
      </p>
    </footer>
    <script type="module" src="/assets/js/build-time.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
