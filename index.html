---
layout: default
---

<header>
	<img class="avatar" src="/favicon.svg" />
	<div>
		<h1>Open Game Icons</h1>
		<p>
			An open source frontend to browse the
			<a href="https://github.com/game-icons/icons">free game icons</a> from
			<a href="https://www.game-icons.net">game-icons.net</a>.
		</p>
	</div>
</header>

<main>
	<div>
		<h1>All Icons</h1>
		<input type="search" id="icon-search" class="icon-search" placeholder="Filter icons by name or tag..." aria-label="Search icons" />
		{% include icon_grid.html icons=site.data.icons.search_index %}
	</div>
</main>

<script>
	const SEARCH_INDEX = {{ site.data.icons.search_index | jsonify }};
</script>
<script src="/assets/js/search.js"></script>
