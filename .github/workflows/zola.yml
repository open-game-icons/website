name: Deploy Zola site to Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do not cancel in-progress runs so production
# deployments can complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          zola --version

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Database
        run: (cd static/assets/icons && ./rebuild_db.sh)

      - name: Generate Content
        run: python3 scripts/generate.py

      - name: Build with Zola
        run: zola build

      - name: Restore legacy .html URLs
        run: python3 scripts/flatten_urls.py

      - name: Check output
        run: python3 scripts/check_links.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
