---
layout: page
---
<div class="icon-page">
<h1>{{ page.display_name }}</h1>

<p>by{% if page.author_link %} <a href="{{ page.author_link }}">{{ page.author_name }}</a>{% else %} {{ page.author_name }}{% endif %} under <a href="{{ page.license_link }}">{{ page.license_name }}</a></p>

{% assign tags = page.tags | split: ',' %}
{% include tag_links.html tags=tags %}

<img class="icon" src="/assets/icons/{{ page.author }}/{{ page.icon_id }}.svg" alt="{{ page.display_name }}">

<div>
	<a class="button" href="/assets/icons/{{ page.author }}/{{ page.icon_id }}.svg" download="{{ page.icon_id }}.svg">Download</a>
</div>

</div>
