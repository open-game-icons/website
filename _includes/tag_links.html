{%- for tag in include.tags -%}
	{%- if site.data.tags[tag].icons.size > 1 -%}
		<a class="tag tag-link" href="/tags/{{ tag }}/">{{ site.data.tags[tag].name | default: tag }}</a>
	{%- else -%}
		<span class="tag tag-plain">{{ site.data.tags[tag].name | default: tag }}</span>
	{%- endif -%}
{%- endfor -%}
