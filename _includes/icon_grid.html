<div class="icon-grid">
  {% for icon in include.icons %}
    {% assign icon_author = icon.author | default: icon.a %}
    {% assign icon_name = icon.name | default: icon.i %}
    <a href="/1x1/{{ icon_author }}/{{ icon_name }}/" id="icon--{{ icon_author }}--{{ icon_name }}" class="icon-grid__item">
      <figure class="icon-cell">
        <img src="/assets/icons/{{ icon_author }}/{{ icon_name }}.svg" alt="{{ icon_name }}" loading="lazy" />
        <figcaption>{{ icon_name }}</figcaption>
      </figure>
    </a>
  {% endfor %}
</div>
