<div class="icon-grid">
  {% for key in include.icons %}
    {% assign icon = site.data.icons[key] %}
    <a href="/1x1/{{ icon.author }}/{{ icon.id }}/" id="icon--{{ icon.author }}--{{ icon.id }}">
      <figure class="icon-cell">
        <img src="/assets/icons/{{ icon.author }}/{{ icon.id }}.svg" loading="lazy" />
        <figcaption>{{ icon.name | default: icon.id }}</figcaption>
      </figure>
    </a>
  {% endfor %}
</div>
