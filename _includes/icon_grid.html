<div class="icon-grid">
  {% for icon in include.icons %}
    <a href="/1x1/{{ icon.author }}/{{ icon.name }}/">
      <figure class="icon-cell">
        <img src="/assets/icons/{{ icon.author }}/{{ icon.name }}.svg" alt="{{ icon.name }}" loading="lazy" />
        <figcaption>{{ icon.name }}</figcaption>
      </figure>
    </a>
  {% endfor %}
</div>
